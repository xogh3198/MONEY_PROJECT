name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            # Amazon Linux 2023 초기 구성
            sudo dnf install -y git docker
            sudo systemctl enable --now docker
            sudo usermod -aG docker "$USER"

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 plugin is required" >&2
              exit 1
            fi

            # 스왑 설정 (없으면 추가 — OOM 방지)
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=128M count=16
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab
            fi

            # 레포 클론 또는 업데이트
            if [ ! -d ~/MONEY_PROJECT ]; then
              git clone https://github.com/xogh3198/MONEY_PROJECT.git ~/MONEY_PROJECT
            fi

            cd ~/MONEY_PROJECT
            git fetch origin main
            git reset --hard origin/main

            # Docker 빌드 캐시 정리 (디스크 확보)
            sudo docker builder prune -f
            sudo docker image prune -f

            # 순차 빌드 (메모리 부족 방지)
            if sudo docker buildx version >/dev/null 2>&1; then
              sudo docker compose build dividend-engine
              sudo docker compose build webhook-gateway
              sudo docker compose build notification
              sudo docker compose build news-service
            else
              echo "Buildx is unavailable; using the Docker legacy builder"
              sudo env DOCKER_BUILDKIT=0 docker build -t money_project-dividend-engine ./services
              sudo env DOCKER_BUILDKIT=0 docker build -t money_project-webhook-gateway ./services/webhook-gateway
              sudo env DOCKER_BUILDKIT=0 docker build -t money_project-notification ./services/notification
              sudo env DOCKER_BUILDKIT=0 docker build -t money_project-news-service ./services/news-service
            fi

            # 실행
            sudo docker compose up -d --no-build

            # DB 마이그레이션 실행 (idempotent - IF NOT EXISTS 사용)
            echo "=== Running DB Migrations ==="
            for sql_file in infra/db/*.sql; do
              if [ -f "$sql_file" ]; then
                echo "Executing: $sql_file"
                sudo docker exec -i money_project-postgres-1 psql -U postgres -d dividend_bot < "$sql_file" || true
              fi
            done

            echo ""
            echo "=== Deploy Complete ==="
            sudo docker compose ps
