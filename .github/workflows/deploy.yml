name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VIDEO_RENDER_ENABLED: ${{ secrets.VIDEO_RENDER_ENABLED }}
          VIDEO_RENDER_ACCESS_KEY: ${{ secrets.VIDEO_RENDER_ACCESS_KEY }}
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          TYPECAST_VOICE_ID: ${{ secrets.TYPECAST_VOICE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,YOUTUBE_API_KEY,VIDEO_RENDER_ENABLED,VIDEO_RENDER_ACCESS_KEY,TYPECAST_API_KEY,TYPECAST_VOICE_ID,PIXABAY_API_KEY
          command_timeout: 30m
          script: |
            set -euo pipefail

            # Amazon Linux 2023 초기 구성
            sudo dnf install -y git docker
            sudo systemctl enable --now docker
            sudo usermod -aG docker "$USER"

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 plugin is required" >&2
              exit 1
            fi

            # 스왑 설정 (없으면 추가 — OOM 방지)
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=128M count=16
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' | sudo tee -a /etc/fstab
            fi

            # 레포 클론 또는 업데이트
            if [ ! -d ~/MONEY_PROJECT ]; then
              git clone https://github.com/xogh3198/MONEY_PROJECT.git ~/MONEY_PROJECT
            fi

            cd ~/MONEY_PROJECT
            git fetch origin main
            git reset --hard origin/main

            # GitHub Actions 시크릿을 Docker Compose 런타임 환경으로 전달한다.
            # 값은 로그에 출력하지 않고 EC2 사용자만 읽을 수 있는 파일에 보관한다.
            RUNTIME_ENV_FILE="$PWD/.env.runtime"
            umask 077
            printf '%s\n' \
              "NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}" \
              "NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}" \
              "YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}" \
              "VIDEO_RENDER_ENABLED=${VIDEO_RENDER_ENABLED:-false}" \
              "VIDEO_RENDER_ACCESS_KEY=${VIDEO_RENDER_ACCESS_KEY:-}" \
              "VIDEO_VOICE_PROVIDER=POLLY" \
              "AWS_REGION=ap-northeast-2" \
              "POLLY_VOICE_ID=Jihye" \
              "POLLY_ENGINE=neural" \
              "TYPECAST_API_KEY=${TYPECAST_API_KEY:-}" \
              "TYPECAST_VOICE_ID=${TYPECAST_VOICE_ID:-}" \
              "PIXABAY_API_KEY=${PIXABAY_API_KEY:-}" \
              > "$RUNTIME_ENV_FILE"

            # Docker 빌드 캐시 정리 (디스크 확보)
            sudo docker builder prune -f
            sudo docker image prune -f

            # 순차 빌드 (메모리 부족 방지)
            echo "Using the Docker legacy builder for Amazon Linux compatibility"
            sudo env DOCKER_BUILDKIT=0 docker build -t money_project-dividend-engine ./services
            sudo env DOCKER_BUILDKIT=0 docker build -t money_project-webhook-gateway ./services/webhook-gateway
            sudo env DOCKER_BUILDKIT=0 docker build -t money_project-notification ./services/notification
            sudo env DOCKER_BUILDKIT=0 docker build -t money_project-news-service ./services/news-service

            # 기존 DB에는 새 이미지가 시작되기 전에 뉴스 스키마를 먼저 확장해야 한다.
            # 신규 DB는 JPA가 기본 테이블을 만든 뒤 아래 공통 마이그레이션에서 처리한다.
            sudo docker compose --env-file "$RUNTIME_ENV_FILE" up -d postgres
            for attempt in $(seq 1 30); do
              if sudo docker exec money_project-postgres-1 pg_isready -U postgres >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "postgres did not become ready" >&2
                exit 1
              fi
              sleep 2
            done

            if [ "$(sudo docker exec money_project-postgres-1 \
              psql -U postgres -d dividend_bot -tAc "SELECT to_regclass('public.news_articles') IS NOT NULL")" = "t" ]; then
              echo "=== Running pre-start news migrations ==="
              for sql_file in \
                infra/db/V4__create_news_article_votes_and_trend_score.sql \
                infra/db/V5__add_external_engagement_metrics.sql; do
                echo "Executing before app start: $sql_file"
                sudo docker exec -i money_project-postgres-1 \
                  psql -v ON_ERROR_STOP=1 -U postgres -d dividend_bot < "$sql_file"
              done
            fi

            # 실행
            sudo docker compose --env-file "$RUNTIME_ENV_FILE" up -d --no-build

            # JPA가 기본 테이블을 생성하고 각 서비스가 정상화될 때까지 대기
            wait_for_health() {
              service_name="$1"
              port="$2"

              for attempt in $(seq 1 90); do
                if curl --fail --silent --show-error "http://127.0.0.1:${port}/actuator/health" | grep -q '"status":"UP"'; then
                  echo "${service_name} is healthy"
                  return 0
                fi

                echo "Waiting for ${service_name} (${attempt}/90)..."
                sleep 2
              done

              echo "${service_name} did not become healthy" >&2
              sudo docker compose ps
              sudo docker compose logs --tail=200 "$service_name"
              return 1
            }

            wait_for_health dividend-engine 8080
            wait_for_health webhook-gateway 8081
            wait_for_health notification 8082
            wait_for_health news-service 8083

            # 참조용 SQL을 제외하고 실제 DB 마이그레이션만 순서대로 실행
            echo "=== Running DB Migrations ==="
            migration_files=(
              infra/db/V001__portfolios_add_dividend_fields.sql
              infra/db/V2__create_notification_preferences.sql
              infra/db/V3__create_forum_posts_and_votes.sql
              infra/db/V4__create_news_article_votes_and_trend_score.sql
              infra/db/V5__add_external_engagement_metrics.sql
              infra/db/V6__create_collector_run_states.sql
              infra/db/V7__create_video_render_jobs.sql
            )

            for sql_file in "${migration_files[@]}"; do
              echo "Executing: $sql_file"
              sudo docker exec -i money_project-postgres-1 \
                psql -v ON_ERROR_STOP=1 -U postgres -d dividend_bot < "$sql_file"
            done

            echo ""
            echo "=== Deploy Complete ==="
            sudo docker compose ps
