spring:
  application:
    name: news-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dividend_bot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  task:
    scheduling:
      pool:
        size: 3
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8083

# 네이버 뉴스 검색 API
naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  # news.naver.com은 robots.txt에서 전체 자동 수집을 차단하므로 기본 비활성화합니다.
  ranking:
    enabled: ${NAVER_RANKING_ENABLED:false}
  datalab:
    enabled: ${NAVER_DATALAB_ENABLED:true}

external:
  metrics:
    enabled: ${EXTERNAL_METRICS_ENABLED:true}
    interval-ms: ${EXTERNAL_METRICS_INTERVAL_MS:900000}
    initial-delay-ms: ${EXTERNAL_METRICS_INITIAL_DELAY_MS:120000}
    refresh-hours: ${EXTERNAL_METRICS_REFRESH_HOURS:6}
    batch-size: ${EXTERNAL_METRICS_BATCH_SIZE:12}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}

video:
  render:
    enabled: ${VIDEO_RENDER_ENABLED:false}
    access-key: ${VIDEO_RENDER_ACCESS_KEY:}
    storage-path: ${VIDEO_RENDER_STORAGE_PATH:/var/lib/investboard/videos}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    max-scenes: ${VIDEO_RENDER_MAX_SCENES:8}
  voice:
    provider: ${VIDEO_VOICE_PROVIDER:POLLY}
    aws-region: ${AWS_REGION:ap-northeast-2}
    polly-voice-id: ${POLLY_VOICE_ID:Jihye}
    polly-engine: ${POLLY_ENGINE:neural}
    typecast-api-key: ${TYPECAST_API_KEY:}
    typecast-voice-id: ${TYPECAST_VOICE_ID:}
    elevenlabs-api-key: ${ELEVENLABS_API_KEY:}
    elevenlabs-voice-id: ${ELEVENLABS_VOICE_ID:}
    elevenlabs-model-id: ${ELEVENLABS_MODEL_ID:eleven_v3}
  assets:
    pixabay-api-key: ${PIXABAY_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production-32chars}
