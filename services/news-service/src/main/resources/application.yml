spring:
  application:
    name: news-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dividend_bot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

server:
  port: 8083

# 네이버 뉴스 검색 API
naver:
  api:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  # news.naver.com은 robots.txt에서 전체 자동 수집을 차단하므로 기본 비활성화합니다.
  ranking:
    enabled: ${NAVER_RANKING_ENABLED:false}
  datalab:
    enabled: ${NAVER_DATALAB_ENABLED:true}

external:
  metrics:
    enabled: ${EXTERNAL_METRICS_ENABLED:true}
    interval-ms: ${EXTERNAL_METRICS_INTERVAL_MS:3600000}
    initial-delay-ms: ${EXTERNAL_METRICS_INITIAL_DELAY_MS:120000}
    refresh-hours: ${EXTERNAL_METRICS_REFRESH_HOURS:6}
    batch-size: ${EXTERNAL_METRICS_BATCH_SIZE:12}
  youtube:
    api-key: ${YOUTUBE_API_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production-32chars}
